spring:
  application:
    name: timelineservice
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017}
      database: ${MONGO_DB:timeline_dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  devtools:
    add-properties: false
  profiles:
    active: dev # default active profile

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
  cors:
    enabled: true
    paths: /**
